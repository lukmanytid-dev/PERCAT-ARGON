<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Argon Admin Panel</title>
    <style>
        /* Gaya dasar meniru Argon Dashboard */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Open Sans', sans-serif; }
        body { background-color: #f8f9fe; display: flex; height: 100vh; overflow: hidden; }

        /* Sidebar */
        .sidebar { width: 250px; background: white; box-shadow: 0 0 2rem 0 rgba(136, 152, 170, 0.15); padding: 20px; z-index: 10; }
        .sidebar h2 { color: #5e72e4; margin-bottom: 30px; text-align: center; font-size: 1.5rem; }
        .nav-item { padding: 12px 15px; margin-bottom: 10px; background: #f6f9fc; border-radius: 8px; color: #32325d; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .nav-item:hover, .nav-item.active { background: #5e72e4; color: white; }

        /* Konten Utama */
        .main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
        .header { background: linear-gradient(87deg, #5e72e4 0, #825ee4 100%); padding: 40px 30px 80px; color: white; }
        
        .content-body { padding: 30px; margin-top: -60px; }
        .card { background: white; border-radius: 8px; box-shadow: 0 0 2rem 0 rgba(136, 152, 170, 0.15); padding: 25px; margin-bottom: 20px; }

        /* Tabel & Form */
        input, select, button { width: 100%; padding: 12px; margin-top: 8px; border: 1px solid #cad1d7; border-radius: 4px; margin-bottom: 15px; }
        button { background: #5e72e4; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background: #324cdd; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { text-align: left; padding: 15px; border-bottom: 1px solid #e9ecef; }
        th { color: #8898aa; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; }
        .badge { padding: 5px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; }
        .badge-admin { background: #f5365c; color: white; }
        .badge-member { background: #2dce89; color: white; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>Argon Panel</h2>
        <div class="nav-item active">Kelola Pengguna</div>
        <div class="nav-item" onclick="window.location.href='index.html'">Kembali ke App</div>
    </div>

    <div class="main-content">
        <div class="header">
            <h1>Manajemen Pengguna</h1>
            <p>Buat dan atur akses akun member aplikasi Anda di sini.</p>
        </div>

        <div class="content-body">
            <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 20px;">
                
                <div class="card">
                    <h3>Buat Akun Baru</h3>
                    <input type="text" id="new-username" placeholder="Username Baru">
                    <input type="password" id="new-password" placeholder="Password">
                    <select id="new-role">
                        <option value="member">Member Biasa</option>
                        <option value="admin">Administrator</option>
                    </select>
                    <button onclick="createUser()">Tambahkan Akun</button>
                </div>

                <div class="card">
                    <h3>Daftar Pengguna Sistem</h3>
                    <table>
                        <thead>
                            <tr>
                                <th>Username</th>
                                <th>Password</th>
                                <th>Hak Akses</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="user-table-body">
                            </tbody>
                    </table>
                </div>

            </div>
        </div>
    </div>

    <script>
        // Proteksi Halaman Admin
        function checkAdminAccess() {
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            if (!currentUser || currentUser.role !== 'admin') {
                alert('Akses Ditolak! Anda bukan admin.');
                window.location.href = 'index.html';
            } else {
                loadUsers();
            }
        }

        // Fitur Membuat Akun Baru
        function createUser() {
            const user = document.getElementById('new-username').value;
            const pass = document.getElementById('new-password').value;
            const role = document.getElementById('new-role').value;

            if (!user || !pass) return alert("Isi username dan password!");

            let users = JSON.parse(localStorage.getItem('users')) || [];
            
            // Cek apakah username sudah ada
            if (users.find(u => u.username === user)) {
                return alert("Username sudah digunakan!");
            }

            users.push({ username: user, password: pass, role: role });
            localStorage.setItem('users', JSON.stringify(users));
            
            document.getElementById('new-username').value = '';
            document.getElementById('new-password').value = '';
            alert("Akun berhasil dibuat!");
            loadUsers();
        }

        // Menampilkan data di tabel
        function loadUsers() {
            const users = JSON.parse(localStorage.getItem('users')) || [];
            const tbody = document.getElementById('user-table-body');
            tbody.innerHTML = '';

            users.forEach((u, index) => {
                const badgeClass = u.role === 'admin' ? 'badge-admin' : 'badge-member';
                tbody.innerHTML += `
                    <tr>
                        <td><strong>${u.username}</strong></td>
                        <td>${u.password}</td>
                        <td><span class="badge ${badgeClass}">${u.role.toUpperCase()}</span></td>
                        <td>
                            <button style="width:auto; padding: 5px 10px; background: #f5365c;" onclick="deleteUser(${index})">Hapus</button>
                        </td>
                    </tr>
                `;
            });
        }

        // Hapus Pengguna
        function deleteUser(index) {
            let users = JSON.parse(localStorage.getItem('users'));
            if (users[index].username === 'admin') {
                return alert("Akun admin utama tidak boleh dihapus!");
            }
            users.splice(index, 1);
            localStorage.setItem('users', JSON.stringify(users));
            loadUsers();
        }

        // Jalankan proteksi saat memuat halaman
        checkAdminAccess();
    </script>
</body>
</html>
