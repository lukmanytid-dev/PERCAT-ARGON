<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Argon Admin - Mode Aman</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f8f9fe; display: flex; height: 100vh; }

        .sidebar { width: 250px; background: white; padding: 20px; box-shadow: 2px 0 10px rgba(0,0,0,0.05); }
        .sidebar h2 { color: #5e72e4; margin-bottom: 20px; }
        
        .main-content { flex: 1; display: flex; flex-direction: column; }
        .header { background: linear-gradient(87deg, #11cdef 0, #1171ef 100%); padding: 40px 30px 80px; color: white; }
        
        .content-body { padding: 30px; margin-top: -60px; }
        .card { background: white; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.08); padding: 25px; margin-bottom: 20px; }

        input, select, button { width: 100%; padding: 12px; margin-top: 8px; border: 1px solid #e0e0e0; border-radius: 5px; margin-bottom: 15px; }
        button { background: #5e72e4; color: white; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { transform: translateY(-1px); box-shadow: 0 4px 6px rgba(50,50,93,0.11); }
        
        /* Desain Tabel Modern */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { text-align: left; padding: 15px; border-bottom: 1px solid #f4f5f7; }
        th { color: #8898aa; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; background: #f6f9fc; }
        
        /* Sensor Password */
        .password-mask { color: #adb5bd; font-size: 1.2rem; letter-spacing: 2px; }
        
        .badge { padding: 6px 12px; border-radius: 30px; font-size: 0.75rem; font-weight: bold; text-transform: uppercase; }
        .badge-admin { background: #f5365c; color: white; }
        .badge-member { background: #2dce89; color: white; }
        .btn-delete { background: #f5365c; width: auto; padding: 6px 12px; font-size: 0.8rem; border-radius: 4px; }
    </style>
</head>
<body>

    <script src="env.js"></script>

    <div class="sidebar">
        <h2>Argon Panel</h2>
        <button onclick="logout()" style="background:#f5365c; margin-top: 20px;">Logout Admin</button>
    </div>

    <div class="main-content">
        <div class="header">
            <h1>Manajemen Kredensial</h1>
        </div>

        <div class="content-body">
            <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 20px;">
                
                <div class="card">
                    <h3>Tambah Pengguna</h3>
                    <input type="text" id="new-username" placeholder="Username">
                    <input type="password" id="new-password" placeholder="Password (Tersembunyi)">
                    <select id="new-role">
                        <option value="member">Member</option>
                        <option value="admin">Admin</option>
                    </select>
                    <button onclick="createUser()">Simpan</button>
                </div>

                <div class="card">
                    <h3>Daftar Akses Sistem</h3>
                    <table>
                        <thead>
                            <tr>
                                <th>Username</th>
                                <th>Password</th>
                                <th>Role</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="user-table-body">
                            <!-- Tabel diisi oleh JS -->
                        </tbody>
                    </table>
                </div>

            </div>
        </div>
    </div>

    <script>
        function checkAdminAccess() {
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            if (!currentUser || currentUser.role !== 'admin') {
                window.location.href = 'index.html';
            } else {
                loadUsers();
            }
        }

        function createUser() {
            const user = document.getElementById('new-username').value;
            const pass = document.getElementById('new-password').value;
            const role = document.getElementById('new-role').value;

            if (!user || !pass) return alert("Lengkapi data!");

            let users = JSON.parse(localStorage.getItem('users')) || [];
            if (users.find(u => u.username === user)) return alert("Username sudah dipakai!");

            users.push({ username: user, password: pass, role: role });
            localStorage.setItem('users', JSON.stringify(users));
            
            document.getElementById('new-username').value = '';
            document.getElementById('new-password').value = '';
            loadUsers();
        }

        function loadUsers() {
            const users = JSON.parse(localStorage.getItem('users')) || [];
            const tbody = document.getElementById('user-table-body');
            tbody.innerHTML = '';

            users.forEach((u, index) => {
                const badgeClass = u.role === 'admin' ? 'badge-admin' : 'badge-member';
                // Password disamarkan di tampilan tabel
                tbody.innerHTML += `
                    <tr>
                        <td><strong>${u.username}</strong></td>
                        <td class="password-mask">&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;</td>
                        <td><span class="badge ${badgeClass}">${u.role}</span></td>
                        <td>
                            <button class="btn-delete" onclick="deleteUser(${index}, '${u.username}')">Hapus</button>
                        </td>
                    </tr>
                `;
            });
        }

        function deleteUser(index, username) {
            // Gunakan variabel dari env.js untuk proteksi akun utama
            if (username === ENV.DEFAULT_ADMIN_USER) {
                return alert("Akun admin utama (dari .env) tidak dapat dihapus dari panel!");
            }
            let users = JSON.parse(localStorage.getItem('users'));
            users.splice(index, 1);
            localStorage.setItem('users', JSON.stringify(users));
            loadUsers();
        }

        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = 'index.html';
        }

        checkAdminAccess();
    </script>
</body>
</html>
