<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Pencatatan</title>
    <style>
        /* CSS sama seperti sebelumnya, dipersingkat untuk fokus pada logika */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: #f4f7f6; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 10px; max-width: 400px; margin: auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input, button { width: 100%; padding: 10px; margin-top: 10px; border-radius: 5px; border: 1px solid #ddd; }
        button { background: #667eea; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>

    <!-- Load file simulasi env -->
    <script src="env.js"></script>

    <div class="card" id="login-view">
        <h2>Login Aplikasi</h2>
        <p style="font-size:12px; color:gray;">Info: Gunakan data dari env.js</p>
        <input type="text" id="login-username" placeholder="Username">
        <input type="password" id="login-password" placeholder="Password">
        <button onclick="login()">Masuk</button>
    </div>

    <script>
        // Gunakan variabel dari env.js untuk membuat akun admin default
        if (!localStorage.getItem('users')) {
            const defaultUsers = [{ 
                username: ENV.DEFAULT_ADMIN_USER, 
                password: ENV.DEFAULT_ADMIN_PASS, 
                role: 'admin' 
            }];
            localStorage.setItem('users', JSON.stringify(defaultUsers));
        }

        function login() {
            const user = document.getElementById('login-username').value;
            const pass = document.getElementById('login-password').value;
            const users = JSON.parse(localStorage.getItem('users'));

            const validUser = users.find(u => u.username === user && u.password === pass);
            if (validUser) {
                localStorage.setItem('currentUser', JSON.stringify(validUser));
                if(validUser.role === 'admin') {
                    window.location.href = 'argon.html';
                } else {
                    alert("Berhasil login sebagai member!");
                }
            } else {
                alert('Username atau password salah!');
            }
        }
    </script>
</body>
</html>
